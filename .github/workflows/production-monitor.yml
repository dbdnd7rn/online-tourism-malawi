name: Production smoke monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: production-smoke-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the production visitor journey
        run: node scripts/production-smoke.mjs
        env:
          SITE_ORIGIN: https://online-tourism-malawi.vercel.app
